name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on other feature branches.
  pull_request:
  workflow_dispatch:

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check annotamate tests

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build the SPA
        run: npm run build

      - name: Check the build output
        working-directory: .
        run: test -f annotamate/server/static/index.html

      # The built SPA is reused by the package and e2e jobs.
      - name: Upload the built SPA
        uses: actions/upload-artifact@v4
        with:
          name: spa
          path: annotamate/server/static/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package (wheel + smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download the built SPA
        uses: actions/download-artifact@v4
        with:
          name: spa
          path: annotamate/server/static

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the distributions
        run: |
          ls -l dist
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*-py3-none-any.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1 or len(glob.glob("dist/*")) != 2:
              sys.exit(f"expected one pure-Python wheel and one sdist, found {sorted(glob.glob('dist/*'))}")

          # `python -m build` builds the wheel from the sdist, so both must carry the SPA
          # and the database migrations.
          wheel = zipfile.ZipFile(wheels[0]).namelist()
          sdist = [n.split("/", 1)[1] for n in tarfile.open(sdists[0]).getnames() if "/" in n]
          for label, names in (("wheel", wheel), ("sdist", sdist)):
              for required in ("annotamate/server/static/index.html", "annotamate/server/migrations/env.py"):
                  if required not in names:
                      sys.exit(f"the {label} does not contain {required}")
              if not any(n.startswith("annotamate/server/static/assets/") for n in names):
                  sys.exit(f"the {label} does not contain the SPA assets")
              if not any(n.startswith("annotamate/server/migrations/versions/") and n.endswith(".py") for n in names):
                  sys.exit(f"the {label} does not contain any migration")
          static = [n for n in wheel if n.startswith("annotamate/server/static/")]
          print(f"{wheels[0]}: {len(wheel)} files, {len(static)} of them in the SPA")
          PY

      - name: Install the wheel in a fresh virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl

      - name: annotamate version
        working-directory: ${{ runner.temp }}
        run: ./venv/bin/annotamate version

      - name: Smoke test (annotamate serve)
        # Run outside the checkout so that the installed wheel is used, not the source tree.
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p smoke/root smoke/data
          ./venv/bin/annotamate serve \
            --host 127.0.0.1 --port 8765 \
            --root "$PWD/smoke/root" --data-dir "$PWD/smoke/data" \
            > smoke/server.log 2>&1 &
          pid=$!

          ok=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8765/api/health > smoke/health.json 2> smoke/curl.err; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::annotamate serve exited before it became healthy"
              break
            fi
            sleep 1
          done

          if [ "$ok" = 1 ]; then
            echo "Health: $(cat smoke/health.json)"
            # The health payload reports status "ok" ...
            python3 -c "import json, sys; d = json.load(open('smoke/health.json')); sys.exit(0 if d.get('status') == 'ok' and d.get('version') else 1)" || ok=0
            # ... and the bundled SPA is served at the root.
            curl --silent --show-error --fail --output smoke/index.html http://127.0.0.1:8765/ || ok=0
            grep -qi "<html" smoke/index.html || { echo "::error::the SPA is not served at /"; ok=0; }
          else
            cat smoke/curl.err || true
          fi

          kill "$pid" 2> /dev/null || true
          wait "$pid" 2> /dev/null || true

          echo "----- server log -----"
          cat smoke/server.log
          [ "$ok" = 1 ]

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/playwright.config.ts starts the server itself (`python -m annotamate serve`
      # with a fresh data dir) and waits for /api/health.
      - name: Download the built SPA
        uses: actions/download-artifact@v4
        with:
          name: spa
          path: annotamate/server/static

      - name: Install the Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: annotamate:ci
          cache-from: type=gha,scope=annotamate
          cache-to: type=gha,scope=annotamate,mode=max

      - name: Smoke test the image
        run: |
          mkdir -p "$RUNNER_TEMP/datasets"
          docker run -d --name annotamate-ci -p 8765:8765             --user "$(id -u):$(id -g)"             --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true             -v "$RUNNER_TEMP/datasets:/data" -v annotamate-ci-state:/var/lib/annotamate             annotamate:ci

          ok=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/api/health > health.json; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" = 1 ]; then
            echo "Health: $(cat health.json)"
            curl --silent --fail http://127.0.0.1:8765/ | grep -qi "<html" || { echo "::error::the SPA is not served at /"; ok=0; }
          fi

          docker logs annotamate-ci
          docker stop annotamate-ci > /dev/null
          [ "$ok" = 1 ]
