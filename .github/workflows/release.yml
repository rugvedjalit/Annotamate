name: Release

# Push a tag such as v2.0.0 (or v2.1.0-rc.1 for a pre-release) to publish:
#   - a GitHub release with the sdist and the wheel (the wheel contains the SPA)
#   - a multi-arch container image on ghcr.io/rugvedjalit/annotamate
#
# Who can release (see docs/guides/maintainers.md):
#   - only maintainers can create `v*` tags (tag ruleset "Release tags");
#   - the tagged commit must already be on `main` (checked below);
#   - publishing runs only in this repository, never in a fork, and only through the `release`
#     and `pypi` environments, which accept `v*` tags only and wait for a maintainer's approval.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  REGISTRY: ghcr.io
  IMAGE_NAME: rugvedjalit/annotamate

jobs:
  build:
    name: Build distributions
    # Forks inherit the workflow file; they must never publish under this project's name.
    if: github.repository == 'rugvedjalit/Annotamate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, to check that the tag is on main
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main. Merge the pull request first, then tag main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build the SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the distributions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          python - <<'PY'
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          tag = os.environ["TAG"]
          wheels = glob.glob("dist/*-py3-none-any.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected one pure-Python wheel and one sdist, found {sorted(glob.glob('dist/*'))}")
          wheel = wheels[0]
          if "annotamate/server/static/index.html" not in zipfile.ZipFile(wheel).namelist():
              sys.exit("the wheel does not contain the built SPA")
          if not any(n.endswith("/annotamate/server/static/index.html") for n in tarfile.open(sdists[0]).getnames()):
              sys.exit("the sdist does not contain the built SPA")

          # For final releases the tag must match the package version exactly.
          # Pre-release tags (v2.1.0-rc.1) are normalised by Python packaging (2.1.0rc1),
          # so they are not compared.
          version = os.path.basename(wheel).split("-")[1]
          if "-" not in tag and tag != f"v{version}":
              sys.exit(f"tag {tag} does not match the package version {version}")
          print(f"OK: {wheel} (version {version}) for tag {tag}")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* \
            --title "Annotamate ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  image:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: release
      url: https://github.com/rugvedjalit/Annotamate/pkgs/container/annotamate
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v2.3.4      -> 2.3.4, 2.3, 2, latest
      # v2.4.0-rc.1 -> 2.4.0-rc.1 only
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Annotamate
            org.opencontainers.image.description=Self-hosted, multi-user image annotation server (YOLO, Pascal VOC, COCO)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.authors=Rugved Jalit
            org.opencontainers.image.vendor=Rugved Jalit

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=annotamate
          cache-to: type=gha,scope=annotamate,mode=max
          # Build provenance and a software bill of materials, attached to the image.
          provenance: mode=max
          sbom: true

  # Optional: publish to PyPI with trusted publishing (no API token).
  # Enable by (1) registering this workflow as a trusted publisher for the
  # `annotamate` project on pypi.org with the environment name `pypi`, and
  # (2) setting the repository variable PUBLISH_TO_PYPI to `true`.
  pypi:
    name: Publish to PyPI
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' && github.repository == 'rugvedjalit/Annotamate' }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/annotamate/
    permissions:
      id-token: write # OpenID Connect token for trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3