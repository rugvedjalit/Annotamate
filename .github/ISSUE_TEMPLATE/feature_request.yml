name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who runs into it (annotator, reviewer, manager, administrator).
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you have in mind. Sketches and examples from other tools are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today, and what else did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Annotator (canvas, tools, shortcuts)
        - Projects, classes, members
        - Review workflow and assignments
        - Chat, comments, messages, notifications
        - Label files (YOLO / VOC / COCO), export, upload
        - Accounts and sign-in
        - Installation, deployment, reverse proxy
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this.
