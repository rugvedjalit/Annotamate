[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "annotamate"
dynamic = ["version"]
description = "Self-hosted, multi-user image annotation server with YOLO, Pascal VOC and COCO labels"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rugved Jalit" }]
requires-python = ">=3.11"
keywords = ["annotation", "labeling", "bounding-box", "yolo", "pascal-voc", "coco", "computer-vision", "dataset"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    # Minimums below exclude versions with published security advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.54.0",
    "h11>=0.16",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pillow>=13.0",
    "python-multipart>=0.0.34",
]

[project.optional-dependencies]
desktop = ["customtkinter", "tkfontawesome"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "hypothesis>=6.100", "build>=1.2"]

[project.scripts]
annotamate = "annotamate.cli:main"

[project.urls]
Homepage = "https://github.com/rugvedjalit/Annotamate"
Source = "https://github.com/rugvedjalit/Annotamate"
Issues = "https://github.com/rugvedjalit/Annotamate/issues"

[tool.hatch.version]
path = "annotamate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["annotamate"]
# The built SPA is git-ignored (generated by `npm run build` in web/) but must ship in the wheel.
artifacts = ["annotamate/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["annotamate", "tests", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["annotamate/server/static/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".", "tests"]
# The legacy Tk app is kept as it was; it is not part of the linted code base.
extend-exclude = ["annotamate/desktop/app.py", "annotamate/server/static"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PIE",
    "RUF",
    "PT",       # pytest style
    "S",        # bandit (security)
    "N",        # naming
]
ignore = [
    "B008",     # FastAPI dependencies in argument defaults
    "RUF001", "RUF002", "RUF003",  # typographic characters in strings/comments are intentional
    "S101",     # assert is fine for internal invariants
    "S311",     # random is not used for security
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S113", "S324", "N802", "N806", "PT018", "S314"]
"annotamate/server/migrations/**" = ["E501"]
"annotamate/cli.py" = ["S104"]  # compares host strings, does not bind

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
