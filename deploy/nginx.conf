# nginx reverse proxy for Annotamate (TLS termination).
#
# Install as /etc/nginx/conf.d/annotamate.conf (or sites-available/ + a symlink
# in sites-enabled/). This file is included inside nginx's `http { }` block.
# Replace annotate.example.com and the certificate paths, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# On the Annotamate side set:
#   ANNOTAMATE_HOST=127.0.0.1         (only the proxy should reach it)
#   ANNOTAMATE_SECURE_COOKIES=true    (users arrive over HTTPS)
#
# nginx on the same machine needs nothing more. When nginx runs elsewhere, set
# FORWARDED_ALLOW_IPS=<address of nginx> on the Annotamate side so that the
# X-Forwarded-For header below is trusted by the sign-in rate limiter.

# WebSocket upgrade: forward "Connection: upgrade" only when the client asked for it.
map $http_upgrade $annotamate_connection {
    default upgrade;
    ''      close;
}

upstream annotamate {
    # One server only. Annotamate runs as a single process and keeps presence
    # and edit locks in memory; do not load-balance across several instances.
    server 127.0.0.1:8765;
}

# HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name annotate.example.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/letsencrypt).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: remove this line and use `listen 443 ssl http2;`
    server_name annotate.example.com;

    ssl_certificate     /etc/letsencrypt/live/annotate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/annotate.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:annotamate_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads. Annotamate enforces ANNOTAMATE_MAX_UPLOAD_MB (default 50) per
    # file; this is the limit for one whole request, which may carry several
    # files. It must not be smaller than ANNOTAMATE_MAX_UPLOAD_MB.
    client_max_body_size 2g;

    # Headers for every proxied request. They are set here, at server level,
    # so that all locations below inherit them (a location that sets its own
    # proxy_set_header would lose all of these).
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;   # unchanged: the WebSocket Origin check compares against it
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $annotamate_connection;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # WebSocket: presence, edit locks, chat and live updates.
    # Clients ping every 20 s, so the connection is never idle for long; the
    # generous timeouts only avoid cutting it during network hiccups.
    location = /api/ws {
        proxy_pass http://annotamate;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }

    # Uploads and export downloads: stream instead of buffering to disk, and
    # allow long transfers.
    location ~ ^/api/projects/[0-9]+/(upload|export)$ {
        proxy_pass http://annotamate;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
    }

    # Everything else: the API, images and the single-page app.
    location / {
        # No URI after the upstream name: the request path is forwarded unchanged.
        proxy_pass http://annotamate;
    }
}

# ---------------------------------------------------------------------------
# Sub-path hosting, for example https://example.com/annotamate/
#
# Start Annotamate with the same prefix:
#   ANNOTAMATE_BASE_URL=/annotamate/      (or: annotamate serve --base-url /annotamate/)
#
# Then, inside the existing `server { }` block of example.com, add the `map`
# and `upstream` from the top of this file plus the proxy_set_header lines
# above, and these locations instead of the three above.
#
# The proxy must forward the path UNCHANGED (no prefix stripping): write
# `proxy_pass http://annotamate;` with NO trailing slash and NO path. With
# `proxy_pass http://annotamate/;` nginx would replace /annotamate/ by / and
# the app would break.
